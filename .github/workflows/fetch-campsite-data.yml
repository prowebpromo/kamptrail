name: Refresh campsite data

on:
  workflow_dispatch:
    inputs:
      states:
        description: 'State codes separated by spaces'
        required: true
        default: 'CA CO UT AZ OR WA MT WY'
        type: string
      source:
        description: 'Source to refresh'
        type: choice
        default: both
        options: [both, ridb, osm]
      page_size:
        description: 'RIDB page size, 1–50; all pages are fetched'
        type: string
        default: '50'
  workflow_call:
    inputs:
      states:
        required: true
        type: string
      source:
        required: false
        type: string
        default: both
      page_size:
        required: false
        type: string
        default: '50'
    secrets:
      RECREATION_GOV_API_KEY:
        required: false
      RIDB_API_KEY:
        required: false
  # This is the only scheduled data writer. All manual workflows call this owner.
  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: write

concurrency:
  group: kamptrail-data-refresh
  cancel-in-progress: false

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      STATE_INPUT: ${{ inputs.states || 'CA CO UT AZ OR WA MT WY' }}
      SOURCE_MODE: ${{ inputs.source || 'both' }}
      PAGE_SIZE: ${{ inputs.page_size || '50' }}
      RIDB_API_KEY: ${{ secrets.RECREATION_GOV_API_KEY || secrets.RIDB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install requests
      - name: Validate refresh inputs
        shell: bash
        run: |
          set -euo pipefail
          case "$SOURCE_MODE" in both|ridb|osm) ;; *) echo 'Invalid source mode'; exit 1 ;; esac
          [[ "$PAGE_SIZE" =~ ^[0-9]{1,2}$ ]] || { echo 'Invalid RIDB page size'; exit 1; }
          (( 10#$PAGE_SIZE >= 1 && 10#$PAGE_SIZE <= 50 )) || { echo 'RIDB page size must be 1–50'; exit 1; }
          python - <<'PY'
          import os
          import sys
          sys.path.insert(0, 'scripts')
          from fetch_recreation_gov_data import US_STATES
          states = os.environ['STATE_INPUT'].split()
          if not states or any(state not in US_STATES for state in states):
              raise SystemExit('Use valid uppercase US state codes separated by spaces')
          PY
          if [[ "$SOURCE_MODE" == ridb && -z "$RIDB_API_KEY" ]]; then
            echo 'Set RECREATION_GOV_API_KEY or RIDB_API_KEY before a RIDB-only refresh'
            exit 1
          fi
      - name: Refresh sources and rebuild visible snapshots
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          for state in $STATE_INPUT; do
            if [[ "$SOURCE_MODE" != osm ]]; then
              if [[ -n "$RIDB_API_KEY" ]]; then
                python scripts/fetch_recreation_gov_data.py --api-key "$RIDB_API_KEY" --state "$state" --limit "$PAGE_SIZE" || {
                  echo "RIDB refresh failed for $state; saved source retained"
                  failures=$((failures + 1))
                }
              else
                echo 'RIDB secret unavailable; retaining saved RIDB source records'
              fi
            fi
            if [[ "$SOURCE_MODE" != ridb ]]; then
              python scripts/fetch_osm_data.py --state "$state" || {
                echo "OSM refresh failed for $state; saved source retained"
                failures=$((failures + 1))
              }
            fi
            node scripts/merge_campsite_data.js --state="$state"
            sleep 5
          done
          echo "Source refresh failures: $failures. Failed sources retained their saved data." >> "$GITHUB_STEP_SUMMARY"
          echo 'Merged snapshots rebuilt for the requested states. No merged output copied over raw sources.' >> "$GITHUB_STEP_SUMMARY"
      - name: Rebuild index from all saved merged snapshots
        shell: bash
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const folder = 'data/campsites';
          const states = fs.readdirSync(folder)
            .filter(file => /^[A-Z]{2}_merged\.geojson$/.test(file))
            .sort()
            .map(file => {
              const data = JSON.parse(fs.readFileSync(path.join(folder, file), 'utf8'));
              if (data.type !== 'FeatureCollection' || !Array.isArray(data.features)) throw new Error(`Invalid snapshot: ${file}`);
              return { state: file.slice(0, 2), count: data.features.length };
            });
          if (!states.length) throw new Error('No saved merged snapshots; index unchanged');
          const index = { generated: new Date().toISOString(), total_sites: states.reduce((total, state) => total + state.count, 0),
            states, source: 'saved-merged-snapshots', version: '3.0' };
          fs.writeFileSync(path.join(folder, 'index.json.tmp'), `${JSON.stringify(index, null, 2)}\n`);
          fs.renameSync(path.join(folder, 'index.json.tmp'), path.join(folder, 'index.json'));
          JS
      - name: Commit successful source and snapshot updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/campsites data/opencampingmap
          if ! git diff --staged --quiet; then
            git commit -m 'Refresh sourced campsite data and merged snapshots'
            git push
          fi
