name: Refresh campsite data

on:
  workflow_dispatch:
    inputs:
      states:
        description: 'State codes separated by spaces'
        required: true
        default: 'CA CO UT AZ OR WA MT WY'
        type: string
      source:
        description: 'Source to refresh'
        type: choice
        default: both
        options: [both, ridb, osm, agency, elevation]
      expected_catalogue:
        description: 'Optional exact census JSON for a reviewed agency release'
        type: string
        default: ''
      page_size:
        description: 'RIDB page size, 1–50; all pages are fetched'
        type: string
        default: '50'
  workflow_call:
    inputs:
      states:
        required: true
        type: string
      source:
        required: false
        type: string
        default: both
      expected_catalogue:
        required: false
        type: string
        default: ''
      page_size:
        required: false
        type: string
        default: '50'
    secrets:
      RECREATION_GOV_API_KEY:
        required: false
      RIDB_API_KEY:
        required: false
  # This is the only scheduled data writer. All manual workflows call this owner.
  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: write

concurrency:
  group: kamptrail-data-refresh
  cancel-in-progress: false

jobs:
  fetch-data:
    if: ${{ inputs.source != 'agency' && inputs.source != 'elevation' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      STATE_INPUT: ${{ inputs.states || 'AL AK AZ AR CA CO CT DE FL GA HI ID IL IN IA KS KY LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WV WI WY' }}
      SOURCE_MODE: ${{ inputs.source || 'both' }}
      PAGE_SIZE: ${{ inputs.page_size || '50' }}
      RIDB_API_KEY: ${{ secrets.RECREATION_GOV_API_KEY || secrets.RIDB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install requests
      - name: Validate refresh inputs
        shell: bash
        run: |
          set -euo pipefail
          case "$SOURCE_MODE" in both|ridb|osm) ;; *) echo 'Invalid source mode'; exit 1 ;; esac
          [[ "$PAGE_SIZE" =~ ^[0-9]{1,2}$ ]] || { echo 'Invalid RIDB page size'; exit 1; }
          (( 10#$PAGE_SIZE >= 1 && 10#$PAGE_SIZE <= 50 )) || { echo 'RIDB page size must be 1–50'; exit 1; }
          python - <<'PY'
          import os
          import sys
          sys.path.insert(0, 'scripts')
          from fetch_recreation_gov_data import US_STATES
          states = os.environ['STATE_INPUT'].split()
          if not states or any(state not in US_STATES for state in states):
              raise SystemExit('Use valid uppercase US state codes separated by spaces')
          PY
          if [[ "$SOURCE_MODE" == ridb && -z "$RIDB_API_KEY" ]]; then
            echo 'Set RECREATION_GOV_API_KEY or RIDB_API_KEY before a RIDB-only refresh'
            exit 1
          fi
      - name: Refresh sources and rebuild visible snapshots
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          node scripts/record_health.js start
          for state in $STATE_INPUT; do
            if [[ "$SOURCE_MODE" != osm ]]; then
              if [[ -n "$RIDB_API_KEY" ]]; then
                if python scripts/fetch_recreation_gov_data.py --api-key "$RIDB_API_KEY" --state "$state" --limit "$PAGE_SIZE"; then
                  # The fresh file replaces the older "(1)" copy, so closed facilities do not linger in the merge.
                  rm -f "data/campsites/${state}(1).geojson"
                  node scripts/record_health.js record ridb "$state" fresh
                else
                  echo "RIDB refresh failed for $state; saved source retained"
                  node scripts/record_health.js record ridb "$state" failed
                  failures=$((failures + 1))
                fi
              else
                echo 'RIDB secret unavailable; retaining saved RIDB source records'
                node scripts/record_health.js record ridb "$state" skipped
              fi
            fi
            if [[ "$SOURCE_MODE" != ridb ]]; then
              if python scripts/fetch_osm_data.py --state "$state"; then
                node scripts/record_health.js record osm "$state" fresh
              else
                echo "OSM refresh failed for $state; saved source retained"
                node scripts/record_health.js record osm "$state" failed
                failures=$((failures + 1))
              fi
            fi
            node scripts/merge_campsite_data.js --state="$state"
            sleep 5
          done
          echo "Source refresh failures: $failures. Failed sources retained their saved data." >> "$GITHUB_STEP_SUMMARY"
          echo 'Merged snapshots rebuilt for the requested states. No merged output copied over raw sources.' >> "$GITHUB_STEP_SUMMARY"
      - name: Rebuild index from all saved merged snapshots
        shell: bash
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const folder = 'data/campsites';
          const states = fs.readdirSync(folder)
            .filter(file => /^[A-Z]{2}_merged\.geojson$/.test(file))
            .sort()
            .map(file => {
              const data = JSON.parse(fs.readFileSync(path.join(folder, file), 'utf8'));
              if (data.type !== 'FeatureCollection' || !Array.isArray(data.features)) throw new Error(`Invalid snapshot: ${file}`);
              return { state: file.slice(0, 2), count: data.features.length };
            });
          if (!states.length) throw new Error('No saved merged snapshots; index unchanged');
          const index = { generated: new Date().toISOString(), total_sites: states.reduce((total, state) => total + state.count, 0),
            states, source: 'saved-merged-snapshots', version: '3.0' };
          fs.writeFileSync(path.join(folder, 'index.json.tmp'), `${JSON.stringify(index, null, 2)}\n`);
          fs.renameSync(path.join(folder, 'index.json.tmp'), path.join(folder, 'index.json'));
          JS
      - name: Refresh agency camping records with fee wording (Forest Service, BLM)
        # Public services, no keys. Each fetch raises before writing on failure or a shrunken result.
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          if python scripts/fetch_usfs_recreation.py; then node scripts/record_health.js record usfs US fresh
          else echo 'USFS refresh failed; saved records kept.' >> "$GITHUB_STEP_SUMMARY"; node scripts/record_health.js record usfs US failed; fi
          if python scripts/fetch_blm_recreation.py; then node scripts/record_health.js record blm US fresh
          else echo 'BLM refresh failed; saved records kept.' >> "$GITHUB_STEP_SUMMARY"; node scripts/record_health.js record blm US failed; fi
          python scripts/build_agency_states.py
      - name: Rebuild national campsite-name search
        run: node scripts/build-search-index.js
      - name: Refresh Recreation.gov site details (RV lengths, hookups, fees, stay limits)
        # Public bulk export, no API key. The builder refuses a shrunken result and keeps saved data.
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          if curl -fsSL --retry 3 -o "$RUNNER_TEMP/ridb.zip" https://ridb.recreation.gov/downloads/RIDBFullExport_V1_CSV.zip \
            && python scripts/build_ridb_sites.py "$RUNNER_TEMP/ridb.zip"; then
            node scripts/record_health.js record ridb_sites US fresh
          else
            echo 'Recreation.gov site details refresh failed; saved data kept.' >> "$GITHUB_STEP_SUMMARY"
            node scripts/record_health.js record ridb_sites US failed
          fi
      - name: Refresh RV services (dump, water fill, propane) from OpenStreetMap
        # A failed Overpass request raises before writing, so saved services stay unchanged.
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          if python scripts/fetch_osm_poi.py && node scripts/build-services.js; then
            node scripts/record_health.js record services US fresh
          else
            echo 'RV services refresh failed; saved data kept.' >> "$GITHUB_STEP_SUMMARY"
            node scripts/record_health.js record services US failed
          fi
      - name: Commit successful source and snapshot updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/campsites data/opencampingmap data/poi_dump_water_propane.geojson data/services data/sources data/health.json
          git add -A data/campsites
          if ! git diff --staged --quiet; then
            git commit -m 'Refresh sourced campsite data and merged snapshots'
            # main can move during a long refresh. Data paths are written only by this workflow, so rebase and retry.
            for attempt in 1 2 3 4 5; do
              if git push; then exit 0; fi
              echo "Push rejected (attempt $attempt); rebasing on the latest main"
              git pull --rebase origin main
              sleep $((attempt * 5))
            done
            echo 'Could not push the refreshed data after 5 attempts' >&2
            exit 1
          fi
  agencies:
    if: ${{ inputs.source == 'agency' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt pyyaml
      - name: Refresh complete official agency sources
        run: |
          python scripts/fetch_usfs_recreation.py
          python scripts/fetch_blm_recreation.py
          python scripts/build_agency_states.py
          node scripts/build-search-index.js
      - name: Check the reviewed census before committing
        env:
          EXPECTED_CATALOGUE: ${{ inputs.expected_catalogue }}
        run: |
          python - <<'PY'
          import collections, hashlib, json, os
          from pathlib import Path
          sites = json.loads(Path('data/campsites/search-index.json').read_text())['sites']
          actual = {'total': len(sites), **dict(collections.Counter(s['m']['f'] for s in sites))}
          expected = json.loads(os.environ['EXPECTED_CATALOGUE']) if os.environ['EXPECTED_CATALOGUE'] else None
          if expected is not None and actual != expected:
              raise SystemExit(f'Reviewed census differs: expected {expected}, received {actual}; nothing committed')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Agency refresh census: `' + json.dumps(actual, sort_keys=True) + '`\n\n')
              for name in ('usfs', 'blm'):
                  p = Path('data/sources') / (name + '.json')
                  summary.write(f'{name} SHA-256: `{hashlib.sha256(p.read_bytes()).hexdigest()}`\n\n')
          PY
      - name: Validate source contracts
        run: python -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Record agency freshness
        run: |
          node scripts/record_health.js start
          node scripts/record_health.js record usfs US fresh
          node scripts/record_health.js record blm US fresh
      - name: Commit only to the selected branch
        id: commit
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/$GITHUB_REF_NAME"
          [[ "$(git rev-parse FETCH_HEAD)" == "$(git rev-parse HEAD)" ]] || { echo 'Selected branch moved; start a fresh reviewed import'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/sources/usfs.json data/sources/blm.json data/sources/agency-quarantine.json data/campsites/agency data/campsites/search-index.json data/health.json
          if ! git diff --staged --quiet; then
            git commit -m 'Refresh complete official agency camping evidence and search snapshots'
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
          printf 'commit_sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'Agency data commit: `%s`\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
  verify-agencies:
    needs: agencies
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ needs.agencies.outputs.commit_sha }}
  elevation:
    if: ${{ inputs.source == 'elevation' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Require a selected branch
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_TYPE" == branch ]] || { echo 'Select a branch, not a tag'; exit 1; }
          git check-ref-format --branch "$GITHUB_REF_NAME"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt pyyaml
      - name: Validate source contracts before sampling
        run: python -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Restore resumable elevation checkpoint
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: .elevation-checkpoint/elevation.json
          # Fixed provider/schema namespace, scoped to this branch; GitHub cache eviction applies.
          key: kamptrail-elevation-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            kamptrail-elevation-v1-${{ github.ref_name }}-
      - name: Bootstrap absent cache and merge validated checkpoint
        id: prepare
        run: |
          python - <<'PY'
          import gzip, json, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from fetch_elevation import atomic_write, cache_entry_valid, load_cache
          path = Path('data/sources/elevation.json')
          if not path.exists():
              with gzip.open('data/sources/elevation-seed.json.gz', 'rt') as seed:
                  atomic_write(path, json.load(seed))
          cache = load_cache(path)
          checkpoint = Path('.elevation-checkpoint/elevation.json')
          candidates = [cache]
          if checkpoint.exists():
              if checkpoint.stat().st_size > 128 * 1024 * 1024:
                  raise SystemExit('Checkpoint exceeds the 128 MiB bound')
              candidates.append(load_cache(checkpoint))
          for candidate in candidates:
              if len(candidate['coordinates']) > 100000 or not all(cache_entry_valid(key, candidate) for key in candidate['coordinates']):
                  raise SystemExit('Invalid elevation cache; preserve it for inspection')
          if len(candidates) == 2:
              restored = candidates[1]
              cache['sources'].update(restored['sources'])
              for key, record in restored['coordinates'].items():
                  existing = cache['coordinates'].get(key)
                  if existing is None or (existing['status'] != 'known' and record['status'] == 'known'):
                      cache['coordinates'][key] = record
          atomic_write(path, cache)
          print(f"Resuming with {len(cache['coordinates'])} validated coordinate records")
          PY
      - name: Sample current catalogue and publish only a complete snapshot
        id: sample
        timeout-minutes: 330
        run: python -u scripts/fetch_elevation.py --catalogue data/campsites/search-index.json
      - name: Preserve validated progress even when sampling fails
        id: checkpoint
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          python - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from fetch_elevation import atomic_write, cache_entry_valid, load_cache
          path = Path('data/sources/elevation.json')
          if path.stat().st_size > 128 * 1024 * 1024:
              raise SystemExit('Cache exceeds the 128 MiB checkpoint bound')
          cache = load_cache(path)
          if len(cache['coordinates']) > 100000 or not all(cache_entry_valid(key, cache) for key in cache['coordinates']):
              raise SystemExit('Invalid cache cannot replace a resumable checkpoint')
          atomic_write('.elevation-checkpoint/elevation.json', cache)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('ready=true\n')
          PY
      - name: Save resumable elevation checkpoint
        if: ${{ always() && steps.checkpoint.outputs.ready == 'true' }}
        timeout-minutes: 5
        uses: actions/cache/save@v4
        with:
          path: .elevation-checkpoint/elevation.json
          key: ${{ steps.restore.outputs.cache-primary-key }}
      - name: Keep a seven-day recovery artifact
        if: ${{ always() && steps.checkpoint.outputs.ready == 'true' }}
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: elevation-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: .elevation-checkpoint/elevation.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      - name: Rebuild search with the complete elevation snapshot
        run: node scripts/build-search-index.js
      - name: Commit elevation only to the unchanged selected branch
        id: commit
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # Refuse to attach a long-running result to intervening code/data changes.
          git fetch origin "refs/heads/$GITHUB_REF_NAME"
          [[ "$(git rev-parse FETCH_HEAD)" == "$(git rev-parse HEAD)" ]] || { echo 'Selected branch moved; checkpoint saved for a fresh run'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A data/sources/elevation.json data/campsites/elevation data/campsites/search-index.json
          if ! git diff --staged --quiet; then
            git commit -m 'Add validated USGS elevation evidence and search snapshots'
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
          printf 'commit_sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'Elevation data commit: `%s`\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
  verify-elevation:
    needs: elevation
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ needs.elevation.outputs.commit_sha }}
