name: Refresh selected OSM states (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

# The called workflow owns the shared concurrency lock and every data write.
jobs:
  refresh:
    uses: ./.github/workflows/fetch-campsite-data.yml
    with:
      states: 'FL KS KY NJ OH SC SD'
      source: osm
    secrets: inherit
