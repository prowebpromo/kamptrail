name: Nonpublishing Google SDK routing contract
on:
  push:
    branches: [review/analytics-sdk-routing]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  routing:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Observe real SDK routing without publishing or sending hits
        run: node scripts/acceptance/google-sdk-routing.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: google-sdk-routing-contract
          path: google-sdk-routing.json
          retention-days: 14
