name: Rest-area retry race negative and positive controls
on:
  push:
    branches: [review/rest-retry-control]
permissions:
  contents: read
jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reproduce original stale-cache race on desktop and mobile
        run: |
          node scripts/acceptance/rest-retry-negative.cjs prepare
          if npx playwright test tests/browser/rest-areas.spec.js -g 'a region that misses its own deadline' --reporter=json > rest-retry-negative.json; then
            exit 1
          fi
          node scripts/acceptance/rest-retry-negative.cjs verify
      - name: Restore reviewed runtime fix
        if: always()
        run: mv rest-areas.js.verified-fix rest-areas.js
      - name: Verify original assertions pass with the fix
        run: npx playwright test tests/browser/rest-areas.spec.js -g 'a region that misses its own deadline' --reporter=json > rest-retry-fixed.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rest-retry-controls
          path: rest-retry-*.json
          retention-days: 14
