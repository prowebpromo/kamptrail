name: Read-only BoB beta analytics acceptance
on:
  push:
    branches: [review/analytics-bob-acceptance]
permissions:
  contents: read
jobs:
  bob:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
      SITE: bob
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Anonymous desktop request, consent, CTA and legacy routing checks
        run: node scripts/acceptance/analytics-live.cjs
      - name: Anonymous mobile request, consent, CTA and legacy routing checks
        env:
          MOBILE: 1
        run: node scripts/acceptance/analytics-live.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bob-beta-live-acceptance
          path: |
            analytics-live-*.json
            analytics-live-*.png
          retention-days: 14
