name: Rest-area generation (pilot)
# Imports the eight new reviewed regions and captures their policy sources as an artifact. No commits.
on:
  push:
    branches: [pilot/rest-area-gen]
permissions:
  contents: read
jobs:
  gen:
    if: github.repository == 'prowebpromo/kamptrail'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Import new regions
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/gen"
          for region in CA IA IN KS MI NV SD WA; do
            python3 scripts/fetch_official_rest_areas.py --region "$region" > "$RUNNER_TEMP/gen/report-$region.json" 2>&1 || echo "$region failed" >> "$RUNNER_TEMP/gen/failures.txt"
          done
          cp data/rest-areas/*.json "$RUNNER_TEMP/gen/"
          python3 scripts/capture_rest_area_sources.py "$RUNNER_TEMP/gen/policy-sources.json" CA IA IN KS MI NV SD WA
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rest-area-gen
          path: ${{ runner.temp }}/gen
          retention-days: 30
