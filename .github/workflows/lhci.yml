name: Lighthouse CI
on: [push, pull_request]

jobs:
  lhci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # Node present (good practice, some actions assume it)
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22

      - name: Install release build dependencies
        run: npm ci

      - name: Build the production release bundle
        run: node scripts/build-release.js

      # Audit the same production package that is published, served on :8080
      - name: Start static server
        run: |
          npm i -g http-server@14
          nohup http-server -p 8080 -c-1 dist/kamptrail >/dev/null 2>&1 &
          sleep 3

      # Run Lighthouse using an action that includes Chrome
      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@12.6.2
        with:
          urls: |
            http://localhost:8080
          temporaryPublicStorage: true
          uploadArtifacts: true
          runs: 1
          # The existing score policy lives in the supported LHCI config.
          # Its warning findings are reported without creating a hard score gate.
          configPath: .lighthouserc.json
