name: Refresh national clearance data

# Monthly OSM height-tag refresh for the 50 states and DC. One Geofabrik extract per job,
# at most two at a time, a pause before each download, retries with backoff, and guards that
# keep the previous file when a fetch fails or a state shrinks sharply. See docs/CLEARANCE_NATIONAL.md.
# Weekday only: the schedule fires on Tuesdays and the gate step lets only the first Tuesday through.
on:
  schedule:
    - cron: '23 5 * * 2'
  workflow_dispatch:
    inputs:
      states:
        description: 'State codes separated by spaces, or ALL (50 states and DC)'
        required: true
        default: 'ALL'
        type: string
      allow_schema_change:
        description: 'Replace a pilot-format file (RI) with the national format. Only after the client reads it.'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: kamptrail-national-clearances
  cancel-in-progress: false

jobs:
  plan:
    if: github.repository == 'prowebpromo/kamptrail'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      states: ${{ steps.plan.outputs.states }}
      run: ${{ steps.plan.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Choose states
        id: plan
        shell: bash
        env:
          STATES_INPUT: ${{ inputs.states || 'ALL' }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == schedule && "$(date -u +%d)" -gt 7 ]]; then
            echo 'Not the first Tuesday of the month; skipping.' >> "$GITHUB_STEP_SUMMARY"
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'states=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          sys.path.insert(0, 'scripts')
          from build_national_clearances import ALL_REGIONS
          wanted = os.environ['STATES_INPUT'].split()
          states = list(ALL_REGIONS) if wanted == ['ALL'] else wanted
          if not states or any(s not in ALL_REGIONS for s in states):
              raise SystemExit('Use ALL or valid uppercase state codes separated by spaces')
          print('run=true')
          print('states=' + json.dumps(states))
          PY

  state:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        state: ${{ fromJSON(needs.plan.outputs.states) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install checksum-pinned native parser
        run: python -m pip install --no-deps --require-hashes -r scripts/requirements-services.txt
      - name: Verify parser, guards and manifest checks
        run: python -m unittest discover -s scripts/tests -p 'test_national_clearances.py'
      - name: Build one state
        env:
          CLEARANCE_STATE: ${{ matrix.state }}
          ALLOW_SCHEMA_CHANGE: ${{ inputs.allow_schema_change && '--allow-schema-change' || '' }}
        run: |
          python -u scripts/build_national_clearances.py build --state "$CLEARANCE_STATE" --pause 10 \
            --stage "$RUNNER_TEMP/stage" --scratch "$RUNNER_TEMP/pbf" $ALLOW_SCHEMA_CHANGE
      - name: Keep the staged state and its status, including a failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clearances-state-${{ matrix.state }}
          overwrite: true
          path: ${{ runner.temp }}/stage
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: [plan, state]
    if: ${{ always() && needs.plan.outputs.run == 'true' && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download every staged state
        uses: actions/download-artifact@v4
        with:
          pattern: clearances-state-*
          path: ${{ runner.temp }}/stage
          merge-multiple: true
      - name: Publish passing states and record failures
        shell: bash
        env:
          PLANNED: ${{ join(fromJSON(needs.plan.outputs.states), ' ') }}
        run: |
          set -euo pipefail
          python3 scripts/build_national_clearances.py publish --stage "$RUNNER_TEMP/stage" --expect $PLANNED | tee "$RUNNER_TEMP/publish.json"
          {
            echo '### National clearance refresh'
            python3 - "$RUNNER_TEMP/publish.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          print(f"Updated {len(d['updated_states'])} states. Failed or kept prior: {', '.join(d['failed']) or 'none'}.")
          print(f"Totals: {d['totals']['records']} records in {d['totals']['states_with_data']} states, {d['totals']['bytes']} bytes.")
          PY
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify hashes and the existing client contract
        run: |
          python3 scripts/build_national_clearances.py verify
          node --test tests/clearances.test.js tests/route-clearance.test.js
      - name: Commit refreshed clearance data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A data/clearances
          if git diff --staged --quiet; then
            echo 'No clearance changes.'
            exit 0
          fi
          git commit -m 'Refresh national OSM clearance data'
          # Only this workflow writes data/clearances (plus the reviewed pilot file), so rebase and retry.
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"; then exit 0; fi
            echo "Push rejected (attempt $attempt); rebasing on the latest branch"
            git pull --rebase origin "$GITHUB_REF_NAME"
            sleep $((attempt * 5))
          done
          echo 'Could not push the refreshed clearance data after 5 attempts' >&2
          exit 1
