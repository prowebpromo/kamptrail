name: Read-only homepage visual acceptance
on:
  push:
    branches: [review/homepage-intent-live]
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
      EXPECTED_SHA: 771125d0ff971bb3096e52559e341b1e1ca2535d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Desktop visual acceptance
        run: node scripts/acceptance/homepage-live.cjs
      - name: Mobile visual acceptance
        env:
          MOBILE: 1
        run: node scripts/acceptance/homepage-live.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homepage-visual-evidence
          path: |
            homepage-live-*.json
            homepage-live-*.png
          retention-days: 14
