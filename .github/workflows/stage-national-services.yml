# Branch-only manual launcher at a workflow path already registered on main.
name: Dispatch the read-only FCC PMTiles qualification
on:
  workflow_dispatch:
    inputs:
      states:
        description: 'One state code or DC; US explicitly requests all 50 states plus DC.'
        type: string
        default: 'NY'
        required: true

permissions:
  contents: read

jobs:
  fcc:
    if: github.repository == 'prowebpromo/kamptrail' && github.ref == 'refs/heads/work/fcc-national-qualification'
    uses: ./.github/workflows/refresh-fcc-mobile.yml
    with:
      scope: ${{ inputs.states }}
    secrets:
      FCC_USERNAME: ${{ secrets.FCC_USERNAME }}
      FCC_TOKEN: ${{ secrets.FCC_TOKEN }}
