name: Stage dated state service extracts

# Produces reviewable candidates only. The existing weekly writer and its
# rebase/retry save path remain the sole repository data-promotion owner.
on:
  workflow_dispatch:
    inputs:
      states:
        description: 'Space-separated Census states; ALL requires complete national proof'
        type: string
        default: 'RI'
        required: true
  workflow_call:
    inputs:
      states:
        type: string
        default: 'ALL'
        required: false
    outputs:
      candidate_artifact:
        description: 'Complete proof and normalized sources from this caller run'
        value: ${{ jobs.aggregate.outputs.candidate_artifact }}

permissions:
  contents: read

concurrency:
  group: kamptrail-services-staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      states: ${{ steps.plan.outputs.states }}
      regions: ${{ steps.plan.outputs.regions }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: plan
        env:
          REQUESTED_STATES: ${{ inputs.states || 'ALL' }}
        run: |
          python - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'scripts')
          from services_regions import URLS
          from stage_services import checked_regions
          regions = checked_regions(URLS if os.environ['REQUESTED_STATES'] == 'ALL' else os.environ['REQUESTED_STATES'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('states=' + json.dumps(regions) + '\n')
              f.write('regions=' + ' '.join(regions) + '\n')
          PY

  state:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        state: ${{ fromJSON(needs.plan.outputs.states) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/stage-services-state
        with:
          state: ${{ matrix.state }}
          batch: ${{ github.run_id }}-${{ github.sha }}

  # At most three new-runner rounds. Successful state artifacts are retained;
  # only an exhausted startup-transport receipt can enter a recovery matrix.
  retry-plan-1:
    needs: [plan, state]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      states: ${{ steps.pending.outputs.states }}
      has_pending: ${{ steps.pending.outputs.has_pending }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@v8.0.2
        with:
          digest-mismatch: warn # Complete checkpoint hashes/schema remain authoritative.
          pattern: services-state-*
          path: ${{ runner.temp }}/stage
          merge-multiple: true
      - name: Validate proofs and select deferred startup failures
        id: pending
        env:
          REGIONS: ${{ needs.plan.outputs.regions }}
          BATCH: ${{ github.run_id }}-${{ github.sha }}
        run: python scripts/plan_services_recovery.py --regions "$REGIONS" --batch "$BATCH" --stage "$RUNNER_TEMP/stage"

  state-retry-1:
    needs: retry-plan-1
    if: ${{ !cancelled() && needs.retry-plan-1.result == 'success' && needs.retry-plan-1.outputs.has_pending == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        state: ${{ fromJSON(needs.retry-plan-1.outputs.states) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/stage-services-state
        with:
          state: ${{ matrix.state }}
          batch: ${{ github.run_id }}-${{ github.sha }}

  retry-plan-2:
    needs: [plan, retry-plan-1, state-retry-1]
    if: ${{ !cancelled() && needs.retry-plan-1.result == 'success' && (needs.state-retry-1.result == 'success' || needs.state-retry-1.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      states: ${{ steps.pending.outputs.states }}
      has_pending: ${{ steps.pending.outputs.has_pending }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@v8.0.2
        with:
          digest-mismatch: warn # Complete checkpoint hashes/schema remain authoritative.
          pattern: services-state-*
          path: ${{ runner.temp }}/stage
          merge-multiple: true
      - name: Validate proofs and select deferred startup failures
        id: pending
        env:
          REGIONS: ${{ needs.plan.outputs.regions }}
          BATCH: ${{ github.run_id }}-${{ github.sha }}
        run: python scripts/plan_services_recovery.py --regions "$REGIONS" --batch "$BATCH" --stage "$RUNNER_TEMP/stage"

  state-retry-2:
    needs: retry-plan-2
    if: ${{ !cancelled() && needs.retry-plan-2.result == 'success' && needs.retry-plan-2.outputs.has_pending == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        state: ${{ fromJSON(needs.retry-plan-2.outputs.states) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/stage-services-state
        with:
          state: ${{ matrix.state }}
          batch: ${{ github.run_id }}-${{ github.sha }}

  retry-plan-3:
    needs: [plan, retry-plan-2, state-retry-2]
    if: ${{ !cancelled() && needs.retry-plan-2.result == 'success' && (needs.state-retry-2.result == 'success' || needs.state-retry-2.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      states: ${{ steps.pending.outputs.states }}
      has_pending: ${{ steps.pending.outputs.has_pending }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@v8.0.2
        with:
          digest-mismatch: warn # Complete checkpoint hashes/schema remain authoritative.
          pattern: services-state-*
          path: ${{ runner.temp }}/stage
          merge-multiple: true
      - name: Validate proofs and select deferred startup failures
        id: pending
        env:
          REGIONS: ${{ needs.plan.outputs.regions }}
          BATCH: ${{ github.run_id }}-${{ github.sha }}
        run: python scripts/plan_services_recovery.py --regions "$REGIONS" --batch "$BATCH" --stage "$RUNNER_TEMP/stage"

  state-retry-3:
    needs: retry-plan-3
    if: ${{ !cancelled() && needs.retry-plan-3.result == 'success' && needs.retry-plan-3.outputs.has_pending == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        state: ${{ fromJSON(needs.retry-plan-3.outputs.states) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/stage-services-state
        with:
          state: ${{ matrix.state }}
          batch: ${{ github.run_id }}-${{ github.sha }}

  aggregate:
    outputs:
      candidate_artifact: ${{ steps.receipt.outputs.name }}
    needs: [plan, retry-plan-3, state-retry-3]
    # Skipped final recovery means all proofs were already complete. A deferred
    # final failure still reaches the unchanged aggregate, which fails closed.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.retry-plan-3.result == 'success' && (needs.state-retry-3.result == 'success' || needs.state-retry-3.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@v8.0.2
        with:
          digest-mismatch: warn # Preserve v4 warning behavior; existing verification steps remain authoritative.
          pattern: services-state-*
          path: ${{ runner.temp }}/stage
          merge-multiple: true
      - name: Validate every requested state and all delivery caps
        env:
          REGIONS: ${{ needs.plan.outputs.regions }}
          BATCH: ${{ github.run_id }}-${{ github.sha }}
        run: python -u scripts/aggregate_services.py --regions "$REGIONS" --batch "$BATCH" --stage "$RUNNER_TEMP/stage" --destination "$RUNNER_TEMP/candidate"
      - id: receipt
        run: echo "name=services-complete-candidate-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - name: Keep public assets, exact normalized sources and checkpoint proof
        uses: actions/upload-artifact@v7.0.2
        with:
          name: services-complete-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
          retention-days: 14
