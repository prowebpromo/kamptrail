name: Verify the published campsite forecast catalogue
on:
  push:
    branches: [verify/forecast-catalogue-33605-20261122]
    paths: ['.github/workflows/forecast-catalogue-sample.yml','scripts/acceptance/public-forecast-catalogue-sample.py']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 scripts/acceptance/public-forecast-catalogue-sample.py
