          for path, expected_sha in expected.items():
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              if actual != expected_sha:
                  raise SystemExit('Source changed since independent review: ' + path)
          print('All reviewed data blobs reproduced exactly:', len(expected))
          PY
      - name: Run the existing refresh guards
        run: bash scripts/verify-refresh.sh HEAD
      - name: Commit only reproduced data to the unchanged review branch
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/campsites/agency data/campsites/identity-hosts.json data/campsites/index.json data/campsites/search-index.json data/sources/usfs.json
          git commit -m 'Regenerate independently reviewed November 23 USFS fee assets'
          git push --force-with-lease="refs/heads/codex/usfs-fee-recheck-2026-11-23:$EXPECTED_HEAD" origin HEAD:refs/heads/codex/usfs-fee-recheck-2026-11-23
