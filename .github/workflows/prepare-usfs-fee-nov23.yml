name: Prepare reviewed November 23 USFS fee assets
on:
  pull_request:
    paths: [.github/workflows/prepare-usfs-fee-nov23.yml]
permissions:
  contents: write
concurrency:
  group: prepare-usfs-fee-nov23
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/usfs-fee-recheck-2026-11-23'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - run: npm ci
      - run: pip install -r requirements.txt pyyaml
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_mysql, gd, mbstring, fileinfo, exif, curl, zlib
          coverage: none
      - name: Reproduce the independently reviewed USFS agency and search assets
        run: |
          python scripts/fetch_usfs_recreation.py
          python scripts/build_agency_states.py
          node scripts/build-search-index.js
      - name: Require exact locally reviewed bytes including the actual receipts
        run: |
          python - <<'PY'
          import subprocess
          expected = {'data/campsites/agency/AK.geojson': '5e9ed07f76c14dfb77fbf21eb3043f79574bc10b', 'data/campsites/agency/AL.geojson': '7919dfe749d06b7fe1e8798098270253bfeaf51d', 'data/campsites/agency/AR.geojson': '6933edad6942d28d63d3b67d0aa3f92ad5c35e7b', 'data/campsites/agency/AZ.geojson': 'b6db6de834ec44eda591a1dfc22b39dc88214fa8', 'data/campsites/agency/CA.geojson': 'b493d5c0bf46b5fbc67d146c8eee6623bc6190c0', 'data/campsites/agency/CO.geojson': '4780d12697107167a5fcc43441e89ca82b5a0b6b', 'data/campsites/agency/FL.geojson': 'f419d8aacba958e848b21854b81b8c0c0a460e6d', 'data/campsites/agency/GA.geojson': '67a381707ea89b9bb81b1957d0ac5113aec4b246', 'data/campsites/agency/ID.geojson': '4836bc7e215ddbdc1055490fb1dd349670f9c229', 'data/campsites/agency/IL.geojson': 'ee40d01f5759fdaf4b931992ba5f1ce336877b47', 'data/campsites/agency/IN.geojson': '7b520cdf6f5f5027a60e08822eb2eaf80f504a87', 'data/campsites/agency/KS.geojson': '5ce782ae3fb4fbb55f75104a5465e143cddd364b', 'data/campsites/agency/KY.geojson': 'c8f2e6cc14dbc3a732b1dd86dd838734cf24ce02', 'data/campsites/agency/LA.geojson': 'bd676bb5843d19e7a73a705bc182b2559eb3bf0e', 'data/campsites/agency/ME.geojson': 'bdcf4818fc563eeed0d3ea00fc90a138714c6c31', 'data/campsites/agency/MI.geojson': '05188cb93b211dbdf8d705a475dfd1b6ffe33e8f', 'data/campsites/agency/MN.geojson': '476d3cca0ad53a5e0035a98f89fce001af186714', 'data/campsites/agency/MO.geojson': '52b8d6e8df0f840f96bf6b4d7fd79acb9eb33ed9', 'data/campsites/agency/MS.geojson': '294f4311189b3e59e7e0020e0ab9b21bd8415a70', 'data/campsites/agency/MT.geojson': 'ce55c8d0015fae4872bc697568e4c469965d3e2b', 'data/campsites/agency/NC.geojson': '08b43766fdaaabc749cdcde930776c378a0ba598', 'data/campsites/agency/ND.geojson': 'f47644efc07565fff75f5215663126e2d7368aa2', 'data/campsites/agency/NE.geojson': '7d5e64cc42468357a556bce2ffaf56d28544e73c', 'data/campsites/agency/NH.geojson': '9ccb3c003a5620cda23b22be9cf350dc27f4aa1d', 'data/campsites/agency/NM.geojson': 'a392b6057c583b4609db4