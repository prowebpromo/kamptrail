name: Publish forecast data

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kamptrail-forecast-publication
  cancel-in-progress: false

jobs:
  produce:
    if: github.repository == 'prowebpromo/kamptrail' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.forecast_package.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Build the exact coordinate catalogue
        run: node scripts/build-search-index.js
      - name: Install reviewed native decoder environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/micromamba"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 90 --retry 2 https://micro.mamba.pm/api/micromamba/linux-64/2.3.3 -o "$RUNNER_TEMP/micromamba.tar.bz2"
          echo "e7274528ceb9c20d048a428d6c22d7e02e268f8ffb762c4c365422347c8b8ba2  $RUNNER_TEMP/micromamba.tar.bz2" | sha256sum --check --status
          tar -xjf "$RUNNER_TEMP/micromamba.tar.bz2" -C "$RUNNER_TEMP/micromamba" bin/micromamba
          export MAMBA_ROOT_PREFIX="$RUNNER_TEMP/forecast-mamba"
          "$RUNNER_TEMP/micromamba/bin/micromamba" create --yes --prefix "$RUNNER_TEMP/forecast-env" --file environment/forecast-linux-64.lock
      - name: Verify native decoder and publication safeguards
        shell: bash
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/micromamba/bin/micromamba" run --prefix "$RUNNER_TEMP/forecast-env" python -m unittest discover -s scripts/tests -p 'test_fetch_forecasts.py'
          python3 -m unittest discover -s scripts/tests -p 'test_publish_forecasts.py'
      - name: Decode and validate NOAA temperature snapshots
        shell: bash
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/micromamba/bin/micromamba" run --prefix "$RUNNER_TEMP/forecast-env" python scripts/fetch_forecasts.py --catalogue data/campsites/search-index.json --cache "$RUNNER_TEMP/ndfd-cache" --output "$RUNNER_TEMP/forecast-output"
          python3 scripts/publish_forecasts.py --input "$RUNNER_TEMP/forecast-output"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: forecast_package
        with:
          name: forecast-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/forecast-output
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    needs: produce
    if: github.repository == 'prowebpromo/kamptrail' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.produce.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/forecast-publish
      - name: Verify coordinates against the checked-out main commit
        run: node scripts/build-search-index.js
      - name: Publish validated immutable generation and alternate pointer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_forecasts.py --input "$RUNNER_TEMP/forecast-publish" --publish
      - name: Warm the normal bounded public reader
        run: |
          python3 - <<'PY'
          import urllib.request
          try:
              request = urllib.request.Request('https://kamptrail.com/api/forecast.php?kind=index', headers={'User-Agent': 'KampTrail-forecast-publisher'})
              with urllib.request.urlopen(request, timeout=20) as response:
                  response.read(1024)
                  print('Forecast cache warm-up requested; normal refresh reservation applies.')
          except Exception:
              print('Forecast cache warm-up deferred; publication remains available.')
          PY
