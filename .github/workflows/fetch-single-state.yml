name: Refresh one state (manual)

on:
  workflow_dispatch:
    inputs:
      state:
        description: 'Uppercase US state code, for example NY'
        required: true
        type: string
        default: NY
      source:
        description: 'Source to refresh'
        type: choice
        default: both
        options: [both, ridb, osm]

permissions:
  contents: write

# The called workflow validates inputs and owns the concurrency lock/data writes.
jobs:
  refresh:
    uses: ./.github/workflows/fetch-campsite-data.yml
    with:
      states: ${{ inputs.state }}
      source: ${{ inputs.source }}
    secrets: inherit
