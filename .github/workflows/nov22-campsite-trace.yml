name: Verify recovered Recreation.gov and Forest Service data
on:
  push:
    branches: [verify/nov22-campsite-refresh]
    paths: ['.github/workflows/nov22-campsite-trace.yml']
permissions:
  actions: read
  contents: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: 7dc8e2f31967d24dc112e8f44f43246c3734c7cb
      - uses: actions/download-artifact@v8.0.2
        with:
          name: unverified-refresh-45012745211-1
          run-id: 45012745211
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@v8.0.2
        with:
          name: november-22-exact-source-evidence
          run-id: 45034863188
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/official
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, gd, mbstring, fileinfo, exif, curl, zlib
      - name: Set up exact regression dependencies
        run: |
          npm ci
          pip install -r requirements.txt pyyaml
      - name: Confirm the published index still rebuilds byte for byte
        run: |
          cp data/campsites/search-index.json "$RUNNER_TEMP/published-index.json"
          node scripts/build-search-index.js
          cmp "$RUNNER_TEMP/published-index.json" data/campsites/search-index.json
      - name: Fetch complete source pages for states with duplicate records or missing published facilities
        id: source
        env:
          RIDB_API_KEY: ${{ secrets.RECREATION_GOV_API_KEY || secrets.RIDB_API_KEY }}
        run: |
          python - <<'PY'
          import collections,json,os,pathlib,sys
          sys.path.insert(0,'scripts')
          from fetch_recreation_gov_data import RIDBFetcher,previous_published_facilities,US_STATES
          from data_integrity import save_geojson
          folder=pathlib.Path('data/campsites'); temp=pathlib.Path(os.environ['RUNNER_TEMP'])
          candidate=temp/'candidate'/'data'/'campsites'
          old=json.loads((temp/'official'/'missing-published.json').read_text())
          exact=json.loads((temp/'official'/'official-facilities.json').read_text())
          missing={s for by_state in old.values() for s in by_state}
          duplicates={}
          for s in US_STATES:
              f=candidate/(s+'.geojson')
              if f.exists():
                  ids=[str(row['properties']['facility_id']) for row in json.loads(f.read_text())['features']]
                  if len(ids)!=len(set(ids)):duplicates[s]=len(ids)-len(set(ids))
          selected=sorted(missing|duplicates.keys())
          print('Source omissions and duplicates:',sorted(missing),duplicates,flush=True)
          fetcher=RIDBFetcher(os.environ['RIDB_API_KEY']);result={};errors={}
          for s in selected:
              try:
                  records=fetcher.fetch_facilities_by_state(s)
                  if not records:raise ValueError('Empty state result')
                  points=fetcher.convert_to_geojson(records,s)
                  start=len(points['features'])
                  restored=fetcher.reconcile_published(points,previous_published_facilities(folder,s),s)
                  ids={str(f['properties']['facility_id']) for f in points['features']}
                  required={fid for fid,row in old.items() if s in row and exact[fid].get('http')==200}
                  if required-ids:raise ValueError('Verified facility IDs still absent: '+str(sorted(required-ids)))
                  save_geojson(candidate/(s+'.geojson'),points)
                  result[s]={'list_records':len(records),'list_points':start,'exact_points':restored,'final_unique_ids':len(ids)}
                  print('STATE_RECEIPT',s,result[s],flush=True)
              except Exception as exc:
                  errors[s]=str(exc)[:240]+' '+str(exc.__cause__ or '')[:240]
                  print('STATE_UNRESOLVED',s,errors[s],flush=True)
          receipt={'previous_nonunique_rows':duplicates,'verified_missing':len(exact),'states':result,'errors':errors}
          (temp/'state-source-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          (temp/'state-source-states.txt').write_text(' '.join(selected))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('qualified='+str(not errors).lower()+'\n')
          PY
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: complete-state-source-receipt
          path: ${{ runner.temp }}/state-source-receipt.json
          retention-days: 14
      - name: Replay all 50 state merges and archive independently verified source losses
        id: candidate
        if: ${{ steps.source.outputs.qualified == 'true' }}
        env:
          CANDIDATE_CODE: 7dc8e2f31967d24dc112e8f44f43246c3734c7cb
        run: |
          set -euo pipefail
          cp data/campsites/search-index.json "$RUNNER_TEMP/old-index.json"
          for dir in campsites opencampingmap services sources rest-areas; do
            rsync -a --delete "$RUNNER_TEMP/candidate/data/$dir/" "data/$dir/"
          done
          cp "$RUNNER_TEMP/candidate/data/health.json" data/health.json
          for state in $(cat "$RUNNER_TEMP/state-source-states.txt"); do node scripts/record_health.js record ridb "$state" fresh; done
          cp "$RUNNER_TEMP/old-index.json" data/campsites/search-index.json
          for file in data/campsites/??_merged.geojson; do
            state=$(basename "$file" _merged.geojson)
            node scripts/merge_campsite_data.js --state="$state" > "$RUNNER_TEMP/merge-$state.log"
          done
          node scripts/build-search-index.js
          node scripts/build-listing-history.js --base-ref HEAD --previous-index "$RUNNER_TEMP/old-index.json"
          node scripts/build-search-index.js
          python scripts/build_usfs_site_amenities.py --snapshot "$RUNNER_TEMP/official/usfs-rows.json" --retrieved "$(cat "$RUNNER_TEMP/official/usfs-retrieved.txt")"
          node -e "const q=require('./data-quality'),d=require('./data/campsites/usfs-site-amenities.json');if(!q.validUSFSSiteAmenities(d))process.exit(1)"
          node scripts/record_health.js record usfs_sites US fresh
          node scripts/build-search-index.js
          git show HEAD:data/campsites/withdrawn.json > "$RUNNER_TEMP/old-withdrawn.json"
          node - <<'JS'
          const fs=require('fs'),index=require('./data/campsites/search-index.json'),before=require(process.env.RUNNER_TEMP+'/old-index.json'),history=require('./data/campsites/withdrawn.json'),h0=require(process.env.RUNNER_TEMP+'/old-withdrawn.json');
          const c=require('./scripts/check-id-continuity');
          console.log('CONTINUITY',JSON.stringify(c.check(before,index,history,h0)));
          console.log('SAVED LINKS',JSON.stringify(index.redirects||{}));
          console.log('Shady Campground',JSON.stringify(index.sites.find(s=>s.id==='ridb:237734')));
          const oldRows=new Map(before.sites.map(s=>[s.id,s])), rows=new Map(index.sites.map(s=>[s.id,s]));
          const ledger1=require('./docs/tourism/owner-decisions-2026-11-01.json');
          const ledger2=require('./docs/tourism/decision-ledger-2026-11-15.json');
          const ownerIds=new Set([...ledger1.records.map(r=>r.id),...ledger2.records.map(r=>r.id),...ledger2.retained_pending_ids]);
          const typeChanges=[], ownerChanges=[];
          for(const [id,prior] of oldRows){
            const now=rows.get(id);
            if(now && now.m.t!==prior.m.t)typeChanges.push({id,name:prior.name,from:prior.m.t,to:now.m.t});
            if(ownerIds.has(id) && (!now || now.m.t!==prior.m.t))ownerChanges.push({id,name:prior.name,from:prior.m.t,to:now?.m.t||'missing'});
          }
          const holds=require('./docs/acceptance/tourism-retained-main-2026-11-15.json').snapshots.holds_after;
          const holdsChanged=holds.flatMap(h=>{
            const snap=JSON.parse(fs.readFileSync('data/campsites/'+h.state+'_merged.geojson'));
            const p=snap.features.find(f=>f.properties.id===h.id)?.properties;
            return p?.access_hold?.value===h.hold.value && p.access_hold.source_record_id===h.hold.source_record_id && !rows.has(h.id)?[]:[h];
          });
          const receipt={code:process.env.CANDIDATE_CODE,original_run:45012745211,
            original_artifact:14753606620,active_before:oldRows.size,active_after:rows.size,previous_history:h0.listings.length,
            historical_after:history.listings.length,continuity:c.check(before,index,history,h0),links:index.redirects||{},
            independent_agencies:index.independent_agencies||[],type_changes:typeChanges,owner_changes:ownerChanges,
            restrictive_hold_changes:holdsChanged,added_history:history.listings.slice(h0.listings.length).map(s=>({id:s.id,name:s.name,reason:s.reason}))};
          fs.writeFileSync(process.env.RUNNER_TEMP+'/qualification.json',JSON.stringify(receipt,null,2)+'\n');
          console.log('OWNER_REVIEW',JSON.stringify({previousPublishedTypeChanges:typeChanges.length,ownerChanges,holdsChanged}));
          console.log('HISTORY_IDS',receipt.added_history.map(h=>h.id).join(' '));

          console.log('ARCHIVE',JSON.stringify(history.listings.slice(h0.listings.length).reduce((n,s)=>(n[s.reason]=(n[s.reason]||0)+1,n),{})));
          JS
      - name: Verify candidate with the complete production refresh gate
        id: regression
        if: ${{ steps.candidate.outcome == 'success' }}
        run: bash scripts/verify-refresh.sh HEAD
      - name: Compare complete browser catalogue with the candidate in both load orders
        id: browser
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        run: |
          set -euo pipefail
          node scripts/check-browser-identity.js --scenarios default,reversed --out "$RUNNER_TEMP/browser-census.json"
          node - <<'JS'
          const r=require(process.env.RUNNER_TEMP+'/browser-census.json');
          const differences=Object.entries(r.scenarios).filter(([k,v])=>Object.values(v.counts).some(Boolean));
          if(differences.length){console.log(JSON.stringify(differences));process.exitCode=1;}
          JS
      - name: Retain the exact candidate and its verification results
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        env:
          REGRESSION: ${{ steps.regression.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/nov22-recovery"
          mkdir "$dir"
          cp "$RUNNER_TEMP/qualification.json" "$RUNNER_TEMP/state-source-receipt.json" "$dir/"
          if [ -f "$RUNNER_TEMP/browser-census.json" ]; then cp "$RUNNER_TEMP/browser-census.json" "$dir/"; fi
          git add -A -- data/campsites data/opencampingmap data/health.json data/sources data/rest-areas data/services
          git diff --cached --binary --full-index HEAD -- data | gzip -n > "$dir/source-and-snapshot.patch.gz"
          git diff --cached --name-status HEAD -- data > "$dir/changed-paths.txt"
          git rev-parse HEAD > "$dir/replay-code.txt"
          echo "production_refresh_gate=$REGRESSION" > "$dir/verification.txt"
          echo "both_browser_load_orders=$BROWSER" >> "$dir/verification.txt"
          cd "$dir"
          sha256sum *.json *.gz *.txt > SHA256SUMS
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        with:
          name: recovered-november-22-campsites
          path: ${{ runner.temp }}/nov22-recovery/
          retention-days: 14
          if-no-files-found: error
