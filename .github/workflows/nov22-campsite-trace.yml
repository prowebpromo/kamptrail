name: Trace the held November campsite snapshot
on:
  push:
    branches: [verify/nov22-campsite-refresh]
    paths: ['.github/workflows/nov22-campsite-trace.yml']
permissions:
  actions: read
  contents: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: 1d9462460d10bc8f33ae21a612669b419a39e1b1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: unverified-refresh-45012745211-1
          run-id: 45012745211
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate
      - name: Report all candidate identity differences across 50 state merges
        run: |
          set -euo pipefail
          cp data/campsites/search-index.json "$RUNNER_TEMP/old-index.json"
          for dir in campsites opencampingmap services sources rest-areas; do
            rsync -a --delete "$RUNNER_TEMP/candidate/data/$dir/" "data/$dir/"
          done
          cp "$RUNNER_TEMP/candidate/data/health.json" data/health.json
          cp "$RUNNER_TEMP/old-index.json" data/campsites/search-index.json
          for file in data/campsites/??_merged.geojson; do
            state=$(basename "$file" _merged.geojson)
            node scripts/merge_campsite_data.js --state="$state" > "$RUNNER_TEMP/merge-$state.log"
          done
          node scripts/build-search-index.js
          node scripts/build-listing-history.js --base-ref HEAD --previous-index "$RUNNER_TEMP/old-index.json"
          node scripts/build-search-index.js
          git show HEAD:data/campsites/withdrawn.json > "$RUNNER_TEMP/old-withdrawn.json"
          node - <<'JS'
          const fs=require('fs'),c=require('./scripts/check-id-continuity'),h=require('./scripts/build-listing-history'),q=require('./data-quality');
          const read=p=>JSON.parse(fs.readFileSync(p)),previous=read(process.env.RUNNER_TEMP+'/old-index.json'),current=read('data/campsites/search-index.json');
          const diff=c.check(previous,current,read('data/campsites/withdrawn.json'),read(process.env.RUNNER_TEMP+'/old-withdrawn.json'));
          console.log('FULL_CONTINUITY',JSON.stringify(diff));
          const relevant=new Set([...diff.lost,...diff.moved,...diff.conflicts].flatMap(v=>[v.id,v.host,v.from,v.to,...(v.hosts||[])].filter(Boolean)));
          for(const key of ['previous','current'])for(const row of (key==='previous'?previous:current).sites)
            if([row.id,...row.legacy_ids].some(x=>relevant.has(x)))console.log('INDEX_RECORD',key,JSON.stringify(row));
          for(const dir of ['data/opencampingmap','data/campsites','data/campsites/agency'])for(const f of fs.readdirSync(dir).filter(x=>/^[A-Z]{2}(?:\(1\)|_merged)?\.geojson$/.test(x))){
            for(const row of read(dir+'/'+f).features){const p=row.properties||{},id=h.recordId(row),n=q.normalizeFeature(row,{state:f.slice(0,2)});
              if([id,p.id,...(p.source_ids||[])].some(x=>relevant.has(x)))console.log('SOURCE_RECORD',dir+'/'+f,JSON.stringify({id,name:p.name,source_ids:p.source_ids,xy:row.geometry?.coordinates,classification:n?.properties?.camping_classification,normalized:n?.properties?.id}));
            }
          }
          JS
      - name: Record current official Geofabrik redirect availability
        run: |
          python - <<'PY'
          import urllib.request
          for state in ['alaska','utah','california','new-york']:
              try:
                  with urllib.request.urlopen(urllib.request.Request(f'https://download.geofabrik.de/north-america/us/{state}-latest.osm.pbf',method='HEAD'),timeout=12) as resp:
                      print('GEOFABRIK',state,resp.status,resp.geturl())
              except OSError as exc:
                  print('GEOFABRIK',state,str(exc))
          PY
