name: Check November state-feed omissions against exact Recreation.gov facilities
on:
  push:
    branches: [verify/nov22-campsite-refresh]
    paths: ['.github/workflows/nov22-campsite-trace.yml']
permissions:
  actions: read
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 653275196f3b9a50e994f5f898f71cd43223ed18
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: november-22-campsite-replay
          run-id: 45032981415
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/prior-replay
      - name: Restore checked public input and isolate active state-feed omissions
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/prior-replay" && sha256sum -c SHA256SUMS)
          cp data/campsites/search-index.json "$RUNNER_TEMP/published.json"
          gzip -dc "$RUNNER_TEMP/prior-replay/source-and-snapshot.patch.gz" | git apply --index --whitespace=nowarn -
          mkdir "$RUNNER_TEMP/exact-facilities"
          python - <<'PY'
          import json, os, pathlib, subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          before=json.loads((root/'published.json').read_text())
          ids={v[5:] for row in before['sites'] for v in [row['id'],*row['legacy_ids']] if v.startswith('ridb:')}
          def scoped(records):
              return {str(f['properties']['facility_id']):{'name':f['properties']['name'],'coordinates':f['geometry']['coordinates']} for f in records['features'] if f['properties'].get('facility_id') is not None}
          old,new={},{}
          files=subprocess.check_output(['git','ls-tree','-r','--name-only','HEAD','data/campsites'],text=True).splitlines()
          import re
          for path in files:
              m=re.match(r'data/campsites/([A-Z]{2})(?:\(1\))?\.geojson$',path)
              if not m:continue
              for fid,props in scoped(json.loads(subprocess.check_output(['git','show','HEAD:'+path]))).items():
                  if fid in ids:old.setdefault(fid,{})[m[1]]=props
          for path in pathlib.Path('data/campsites').glob('*.geojson'):
              m=re.fullmatch(r'([A-Z]{2})(?:\(1\))?\.geojson',path.name)
              if not m: continue
              for fid in scoped(json.loads(path.read_text())):new.setdefault(fid,set()).add(m[1])
          absent={fid:old[fid] for fid in sorted(set(old)-set(new),key=int)}
          (root/'exact-facilities'/'missing-published.json').write_text(json.dumps(absent))
          print('Active Recreation.gov identities absent from all current raw files:',len(absent))
          print('By previous state', {s:sum(s in states for states in absent.values()) for s in sorted({s for states in absent.values() for s in states})})
          PY
      - name: Retrieve every omitted published record from its official ID endpoint
        env:
          RIDB_API_KEY: ${{ secrets.RECREATION_GOV_API_KEY || secrets.RIDB_API_KEY }}
        run: |
          python - <<'PY'
          import json,os,pathlib,sys,time,datetime,collections
          sys.path.insert(0,'scripts')
          from fetch_ridb_facility_evidence import make_get,BASE_URL,same_id
          key=os.environ['RIDB_API_KEY']
          if not key:raise ValueError('RIDB credential is unavailable')
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'exact-facilities'
          absent=json.loads((path/'missing-published.json').read_text())
          get=make_get(key); result={}
          for fid,prior in absent.items():
              row={'verified_at':datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='seconds')}
              try:
                  response=get(BASE_URL+'/facilities/'+fid,params={'full':'true'})
                  row['http']=response.status
                  if response.status==200:
                      facility=response.json()
                      if not isinstance(facility,dict) or not same_id(facility.get('FacilityID'),fid):raise ValueError('FacilityID mismatch')
                      row['facility']=facility
                      xyz=[float(facility['FacilityLongitude']),float(facility['FacilityLatitude'])]
                      row['coordinate_match']=any(xyz==v['coordinates'] for v in prior.values())
                  elif response.status not in (404,410):
                      row['error']='unavailable'
              except Exception as exc:
                  row['error']=type(exc).__name__
              result[fid]=row;time.sleep(1.25)
          (path/'official-facilities.json').write_text(json.dumps(result,ensure_ascii=False))
          print('EXACT_HTTP',dict(collections.Counter((r.get('http'),r.get('error')) for r in result.values())))
          print('MOVED_COORDINATES',[fid for fid,r in result.items() if r.get('coordinate_match') is False])
          for fid in ('10069432','10278932','234159'):
              row=result.get(fid,{});f=row.get('facility',{})
              print('REVIEWED',fid,row.get('http'),row.get('error'),f.get('FacilityName'),f.get('FacilityTypeDescription'),row.get('coordinate_match'),[a.get('ActivityName') for a in f.get('ACTIVITY',[])])
          PY
      - name: Retrieve the existing public Forest Service table with its source guards
        if: ${{ !cancelled() }}
        run: |
          python - <<'PY'
          import datetime,json,sys,pathlib,os
          sys.path.insert(0,'scripts')
          import build_usfs_site_amenities as forest
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'exact-facilities'
          wanted=forest.catalogue_facilities('data/campsites/search-index.json')
          saved=json.loads(pathlib.Path('data/campsites/usfs-site-amenities.json').read_text())
          print('NO_LONGER_IN_CANDIDATE',sorted(set(saved['facilities'])-wanted,key=int))
          try:
              rows=forest.fetch_rows()
              print('USFS raw rows',len(rows))
              (path/'usfs-rows.json').write_text(json.dumps({'rows':rows}))
              (path/'usfs-retrieved.txt').write_text(datetime.datetime.now(datetime.timezone.utc).date().isoformat())
          except Exception as exc:
              print('USFS live source unavailable',str(exc)[:220])
          PY
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: november-22-exact-source-evidence
          path: ${{ runner.temp }}/exact-facilities
          retention-days: 14
          if-no-files-found: error
