name: Trace the held November campsite snapshot
on:
  push:
    branches: [verify/nov22-campsite-refresh]
    paths: ['.github/workflows/nov22-campsite-trace.yml']
permissions:
  actions: read
  contents: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: 1e195c9ea930880d51f5216a6b9a333f8e13328e
      - uses: actions/download-artifact@v8.0.2
        with:
          name: unverified-refresh-45012745211-1
          run-id: 45012745211
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate
      - name: Exercise current and prior exact Geofabrik paths
        run: python -m unittest scripts/tests/test_services_import.py scripts/tests/test_national_services.py scripts/tests/test_services_recovery.py
      - name: Replay the held source bytes; rebuild snapshot and preserve all previously published identities 
        run: |
          set -euo pipefail
          cp data/campsites/search-index.json "$RUNNER_TEMP/old-index.json"
          for dir in campsites opencampingmap services sources rest-areas; do
            rsync -a --delete "$RUNNER_TEMP/candidate/data/$dir/" "data/$dir/"
          done
          cp "$RUNNER_TEMP/candidate/data/health.json" data/health.json
          cp "$RUNNER_TEMP/old-index.json" data/campsites/search-index.json
          for state in CA CO UT; do
            node scripts/merge_campsite_data.js --state="$state" > "$RUNNER_TEMP/merge-$state.log"
          done
          node scripts/build-search-index.js
          node - <<'JS'
          const fs=require('fs'),q=require('./data-quality'),h=require('./scripts/build-listing-history');
          const prev=require(process.env.RUNNER_TEMP+'/old-index.json'),next=require('./data/campsites/search-index.json');
          const map=new Map(next.sites.flatMap(f=>[f.id,...f.legacy_ids].map(id=>[id,f.id])));
          for(const file of ['data/campsites/UT_merged.geojson','data/campsites/agency/UT.geojson']){
            for(const f of JSON.parse(fs.readFileSync(file)).features){
              const p=f.properties, n=q.normalizeFeature(f,{state:'UT'});
              if(/green river camps|horsethief campground/i.test(p.name||'') || ['usfs:80672','osm:relation:17579544'].includes(p.id))
                console.log('UT-NEIGHBOR',file,p.id,p.source_ids,p.name,f.geometry.coordinates,n?.properties.id,n?.properties.camping_classification,n?.properties.exclusion_reason,n?.properties.legacy_ids);
            }
          }
          console.log('UT-OLD',prev.sites.filter(r=>/green river camps|horsethief campground/i.test(r.name)&&r.states.includes('UT')).map(r=>[r.id,r.name,r.legacy_ids]));
          console.log('UT-NEW',next.sites.filter(r=>/green river camps|horsethief campground/i.test(r.name)&&r.states.includes('UT')).map(r=>[r.id,r.name,r.legacy_ids]));
          const outdated=new Set(prev.sites.filter(f=>!next.sites.some(n=>n.id===f.id)).map(f=>f.id));
          for(const file of fs.readdirSync('data/opencampingmap').filter(f=>/^[A-Z]{2}\.geojson$/.test(f)).map(f=>'data/opencampingmap/'+f).concat(fs.readdirSync('data/campsites/agency').filter(f=>/^[A-Z]{2}\.geojson$/.test(f)).map(f=>'data/campsites/agency/'+f))) {
            for(const f of JSON.parse(fs.readFileSync(file)).features){const id=h.recordId(f);if(outdated.has(id)){
              const n=q.normalizeFeature(f,{state:file.split('/').pop().slice(0,2)});console.log('RESIDUAL',file,id,map.get(id),f.properties.name, n?.properties?.camping_classification,n?.properties?.id,n?.properties?.exclusion_reason);
            }}
          }
          JS
          node scripts/build-listing-history.js --base-ref HEAD --previous-index "$RUNNER_TEMP/old-index.json"
          node scripts/build-search-index.js
          git show HEAD:data/campsites/withdrawn.json > "$RUNNER_TEMP/old-withdrawn.json"
          node scripts/check-id-continuity.js "$RUNNER_TEMP/old-index.json" data/campsites/search-index.json data/campsites/withdrawn.json "$RUNNER_TEMP/old-withdrawn.json"
