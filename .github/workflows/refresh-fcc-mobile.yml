# A single reviewed fast-forward qualifies all US states and DC. This workflow
# never deploys or requests repository write permission.
name: One-time US FCC carrier coverage qualification
on:
  push:
    branches: [once/fcc-national-20261120]

permissions:
  contents: read

concurrency:
  group: kamptrail-fcc-mobile-data
  cancel-in-progress: false

jobs:
  plan:
    if: github.repository == 'prowebpromo/kamptrail' && github.event_name == 'push' && github.ref == 'refs/heads/once/fcc-national-20261120' && github.event.before == '0bb50cf74cee3ed25a8f09e201591f1d851f1cdb'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      lanes: ${{ steps.plan.outputs.lanes }}
      artifact: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 2}
      - name: Verify all qualification source bytes against the approved commit
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "0bb50cf74cee3ed25a8f09e201591f1d851f1cdb"
          test -z "$(git diff --name-only HEAD^ HEAD -- scripts)"
      - run: |
          sudo apt-get -qq update
          sudo apt-get -qq install --no-install-recommends python3-fiona
          /usr/bin/python3 -m unittest discover -s scripts/tests -p 'test_qualify_fcc_national.py'
      - name: Freeze one filing, provider catalog, Census boundary and fair worker slots
        id: plan
        env:
          SCOPE: US
          FCC_USERNAME: ${{ secrets.FCC_USERNAME }}
          FCC_TOKEN: ${{ secrets.FCC_TOKEN }}
        run: /usr/bin/python3 scripts/qualify_fcc_national.py plan --scope "$SCOPE" --output "$RUNNER_TEMP/fcc-plan"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: artifact
        with:
          name: fcc-catalog-plan
          path: ${{ runner.temp }}/fcc-plan
          overwrite: true
          if-no-files-found: error
          retention-days: 2
  provider:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        lane: ${{ fromJSON(needs.plan.outputs.lanes) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.plan.outputs.artifact }}
          path: ${{ runner.temp }}/fcc-plan
          merge-multiple: true
      - name: Set up geospatial tools and pinned PMTiles package
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install --no-install-recommends python3-gdal python3-numpy python3-fiona python3-pyproj python3-shapely python3-pil
          python3 -m pip install --target "$RUNNER_TEMP/pmdeps" --only-binary=:all: --no-deps --require-hashes -r scripts/requirements-fcc-pmtiles.txt
          echo "PYTHONPATH=$RUNNER_TEMP/pmdeps" >> "$GITHUB_ENV"
      - name: Download one provider at a time; independently qualify spatial samples and every packed tile
        env:
          LANE: ${{ matrix.lane }}
          FCC_USERNAME: ${{ secrets.FCC_USERNAME }}
          FCC_TOKEN: ${{ secrets.FCC_TOKEN }}
        run: /usr/bin/python3 scripts/qualify_fcc_national.py acquire --plan "$RUNNER_TEMP/fcc-plan/plan.json" --lane "$LANE" --output "$RUNNER_TEMP/provider-results"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && !cancelled()
        with:
          name: fcc-packed-lane-${{ matrix.lane }}
          path: ${{ runner.temp }}/provider-results
          overwrite: true
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
  aggregate:
    needs: [plan, provider]
    if: needs.provider.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.plan.outputs.artifact }}
          path: ${{ runner.temp }}/fcc-plan
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: fcc-packed-lane-*
          # With a single match v8 extracts directly into path. Multiple matches use named subfolders.
          path: ${{ runner.temp }}/lanes${{ needs.plan.outputs.lanes == '[0]' && '/fcc-packed-lane-0' || '' }}
      - name: Verify every expected archive and record missing catalog pairs
        run: python3 scripts/qualify_fcc_national.py assemble --plan "$RUNNER_TEMP/fcc-plan/plan.json" --lanes "$RUNNER_TEMP/lanes" --output "$RUNNER_TEMP/qualified"
      - name: Record nationwide coverage, capacity and source evidence
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/qualified/qualification.json" <<'PY'
          import json, sys
          q=json.load(open(sys.argv[1]))
          rows=q["shards"]
          summary={"release":q["release"],"scope":q["scope"],"archives":len(rows),"statesAndDC":len({r["region"] for r in rows}),"nativeRecords":sum(r["records"] for r in rows),"packedBytes":q["packedBytes"],"sourceZipBytes":sum(r["sourceBytes"] for r in rows),"largestPacked":max((r["pmtilesBytes"],r["region"],r["carrier"]) for r in rows),"largestRaw":max((r["sourceBytes"],r["region"],r["carrier"]) for r in rows),"absent":q["explicitlyMissing"],"statesByCarrier":{c:sum(r["carrier"]==c for r in rows) for c in sorted({r["carrier"] for r in rows})}}
          matches={}
          for row in rows:
              for category,count in row["spatial"]["matches"].items(): matches[category]=matches.get(category,0)+count
          summary["independentNativePixelChecks"]=matches
          print("NATIONAL-CAPACITY "+json.dumps(summary,sort_keys=True))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fcc-national-qualification
          path: ${{ runner.temp }}/qualified
          overwrite: true
          if-no-files-found: error
          retention-days: 14
