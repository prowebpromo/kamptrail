name: Test KampTrail
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: pip install -r requirements.txt pyyaml
      - run: npm test
      - run: npm run test:python
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: kamptrail-static
          path: dist/kamptrail
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report
          path: |
            playwright-report
            test-results
