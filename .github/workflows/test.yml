name: Test KampTrail
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-only
          MYSQL_DATABASE: kamptrail_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: pip install -r requirements.txt pyyaml
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_mysql, gd, mbstring, fileinfo, exif
          coverage: none
      - run: npm test
        env:
          KT_REQUIRE_PHP: '1'
      - name: Verify community API on MySQL
        run: node --test tests/community.test.js
        env:
          KT_REQUIRE_PHP: '1'
          KT_TEST_MYSQL_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=kamptrail_test;charset=utf8mb4'
      - run: npm run test:python
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: kamptrail-static
          path: dist/kamptrail
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report
          path: |
            playwright-report
            test-results
