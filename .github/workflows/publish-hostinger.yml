name: Publish Hostinger release

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Bot data commits do not trigger push workflows. Completion of every refresh
  # entry point does, so refreshed data goes through the same validation gate.
  workflow_run:
    workflows:
      - Refresh campsite data
      - Refresh all states (manual)
      - Refresh selected OSM states (manual)
      - Refresh one state (manual)
      - Refresh Florida OSM (manual)
      - Refresh Recreation.gov (manual)
      - Refresh Recreation.gov API (manual)
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: kamptrail-hostinger-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-only
          MYSQL_DATABASE: kamptrail_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: pip install -r requirements.txt pyyaml
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_mysql, gd, mbstring, fileinfo, exif, curl, zlib
          coverage: none
      - run: npm test
        env:
          KT_REQUIRE_PHP: '1'
      - name: Verify community and routing APIs on MySQL
        run: node --test --test-concurrency=1 tests/community.test.js tests/routing-api.test.js
        env:
          KT_REQUIRE_PHP: '1'
          KT_TEST_MYSQL_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=kamptrail_test;charset=utf8mb4'
      - name: Restore a disposable MySQL backup including photos
        run: node --test tests/mysql-backup.test.js
        env:
          KT_MYSQL_CONTAINER: ${{ job.services.mysql.id }}
      - run: npm run test:python
      - run: npx playwright install --with-deps chromium
      - run: npm run build:search
      - run: npm run test:browser
      - run: npm run build
        env:
          KAMPTRAIL_PUBLIC_URL: https://kamptrail.com/
      - name: Publish tested static files with release history
        run: node scripts/publish-hostinger.js
      - uses: actions/upload-artifact@v4
        with:
          name: kamptrail-hostinger
          path: dist/kamptrail
          include-hidden-files: true
