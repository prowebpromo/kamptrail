name: Publish Hostinger release

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Bot data commits do not trigger push workflows. Completion of every refresh
  # entry point does, so refreshed data goes through the same validation gate.
  workflow_run:
    workflows:
      - Refresh FCC mobile coverage
      - Refresh lower 48 FCC mobile coverage
      - Refresh campsite data
      - Refresh all states (manual)
      - Refresh selected OSM states (manual)
      - Refresh one state (manual)
      - Refresh Florida OSM (manual)
      - Refresh Recreation.gov (manual)
      - Refresh Recreation.gov API (manual)
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: kamptrail-hostinger-release
  cancel-in-progress: false

jobs:
  gate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push'
        with:
          fetch-depth: 2
          sparse-checkout: .github/fcc-conus48-adoption.json
          sparse-checkout-cone-mode: false
      - name: Let a newly requested FCC adoption qualify before deploying its app
        id: gate
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if ! git cat-file -e "$PREVIOUS_SHA^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$PREVIOUS_SHA"
            fi
            changed=$(git diff --name-only "$PREVIOUS_SHA" "$GITHUB_SHA" -- .github/fcc-conus48-adoption.json)
            if [ -n "$changed" ]; then
              echo 'deploy=false' >> "$GITHUB_OUTPUT"
              echo 'The verified FCC adoption workflow will trigger this deployment.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          echo 'deploy=true' >> "$GITHUB_OUTPUT"
  release:
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-only
          MYSQL_DATABASE: kamptrail_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    # Match regression coverage while allowing setup, packaging and publication.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - run: npm ci
      - run: pip install -r requirements.txt pyyaml
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_mysql, gd, mbstring, fileinfo, exif, curl, zlib
          coverage: none
      - run: npm test
        env:
          KT_REQUIRE_PHP: '1'
      - name: Verify community and routing APIs on MySQL
        run: node --test --test-concurrency=1 tests/community.test.js tests/routing-api.test.js tests/permissions-api.test.js
        env:
          KT_REQUIRE_PHP: '1'
          KT_TEST_MYSQL_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=kamptrail_test;charset=utf8mb4'
      - name: Restore a disposable MySQL backup including photos
        run: node --test tests/mysql-backup.test.js
        env:
          KT_MYSQL_CONTAINER: ${{ job.services.mysql.id }}
      - run: npm run test:python
      - name: Verify runner Chrome
        run: |
          test -x /usr/bin/google-chrome
          /usr/bin/google-chrome --version
      - run: npm run build:search
      - run: npm run test:browser
      - run: npm run build
        env:
          KAMPTRAIL_PUBLIC_URL: https://kamptrail.com/
      - name: Package the current verified mobile coverage generation
        run: python3 scripts/publish_fcc_tiles.py package dist/kamptrail/data/fcc-coverage --require-contiguous
      - name: Publish tested static files with release history
        run: node scripts/publish-hostinger.js
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: kamptrail-hostinger
          path: dist/kamptrail
          include-hidden-files: true
