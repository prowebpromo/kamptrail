name: Refresh Recreation.gov (manual)

on:
  workflow_dispatch:
    inputs:
      states:
        description: 'RIDB source refresh; uppercase state codes separated by spaces'
        required: true
        default: 'NH ME VT MA CT RI'
        type: string
      page_size:
        description: 'RIDB page size, 1–50; all pages are fetched'
        required: false
        default: '50'
        type: string

permissions:
  contents: write

# The called workflow validates inputs and owns the concurrency lock/data writes.
jobs:
  refresh:
    uses: ./.github/workflows/fetch-campsite-data.yml
    with:
      states: ${{ inputs.states }}
      source: ridb
      page_size: ${{ inputs.page_size }}
    secrets: inherit
